services:
  web:
    build: .
    container_name: myblog-web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # SQLite 数据库
      - ./media:/app/media        # 用户上传的图片
      - ./staticfiles:/app/staticfiles       # 收集后的静态文件
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "uv run --no-sync python manage.py migrate &&
             uv run --no-sync python manage.py collectstatic --noinput &&
             uv run --no-sync gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
