{% extends "base.html" %}

{% block title %}登录 | 我的博客{% endblock %}

{% block content %}
  <h1>登录</h1>

  <form method="post" class="auth-form">
       {% csrf_token %}
       {{ form.as_p }}
       <button type="submit">登录</button>
  </form>

  <p>
      还没有账号？
      <a href="{% url 'blog:register' %}">请去注册</a>
  </p>
{% endblock %}
